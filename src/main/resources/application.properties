spring.datasource.url=jdbc:mysql://localhost:3306/ai_knowledge?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai

spring.datasource.username=root

spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

