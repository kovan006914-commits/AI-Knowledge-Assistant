spring.application.name=AI-Knowledge-Assistant
spring.profiles.default=demo
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-stacktrace=never
mybatis.configuration.map-underscore-to-camel-case=true
app.ai.api-key=${AI_API_KEY:}
app.ai.base-url=${AI_BASE_URL:https://api.openai.com/v1}
app.ai.model=${AI_MODEL:gpt-4o-mini}
