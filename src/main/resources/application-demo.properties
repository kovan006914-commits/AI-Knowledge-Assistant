spring.datasource.url=jdbc:h2:file:./data/knowledge;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER
spring.datasource.username=sa
spring.datasource.password=${DEMO_DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-demo.sql
spring.h2.console.enabled=false
