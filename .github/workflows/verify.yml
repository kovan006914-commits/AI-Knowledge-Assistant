name: Verify 1.0
on:
  push:
    branches: [main, codex/v1-20261027]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test and package
        run: bash mvnw -B verify
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start packaged app
        run: |
          java -jar target/AI-Knowledge-Assistant-1.0.0.jar > target/app.log 2>&1 &
          echo $! > target/app.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/status; then exit 0; fi
            sleep 1
          done
          cat target/app.log
          exit 1
      - name: Browser smoke test
        run: node scripts/ui-smoke.cjs
      - name: Stop app
        if: always()
        run: |
          if [ -f target/app.pid ]; then kill "$(cat target/app.pid)" || true; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knowledge-assistant-1.0
          path: |
            target/AI-Knowledge-Assistant-1.0.0.jar
            target/surefire-reports/
            target/ui-*.png
            target/app.log
          retention-days: 14
